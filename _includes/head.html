<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width" />

<link rel="stylesheet" href="{{ '/main.css' | relative_url }}" type="text/css" />
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

{% seo title=false %}

<title>{% if page.title %}{{page.title | strip_html}} | {{site.title}}{% else %}{{site.title}}{% endif %}</title>

{% unless page.image %}
  {% if page.slug %}
    <meta property="og:image" content="{{site.url}}/imgs/projects/{{page.slug}}.png" />
    <meta property="twitter:image" content="{{site.url}}/imgs/projects/{{page.slug}}.png" />
  {% endif %}
{% endunless %}

<script data-goatcounter="https://data-and-design.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
